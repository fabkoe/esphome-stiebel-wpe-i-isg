substitutions:
  can_bitrate: "50kbps"

esphome:
  name: wpe-i-heatpump
  friendly_name: WPE-I Waermepumpe

esp32:
  board: esp32-s3-devkitc-1
  framework:
    # esp-idf statt arduino: der arduino-Core lieferte vorkompilierte WLAN-
    # Blobs, die mit ESP-IDF 5.5.5 (ESPHome 2026.7.3) nicht zusammenpassten
    # -> Linkfehler in libwpa_supplicant.a (hostapd_send_eapol / wpa_sm_*).
    # esp-idf baut den WLAN-/Supplicant-Stack konsistent aus dem Quellcode.
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  level: DEBUG

api:

ota:
  platform: esphome
  password: !secret ota_password

# =========================================================================
# Stiebel Eltron WPE-I 06 HKW 230 Premium - Elster/Kromschroeder-Protokoll
# Reverse-engineered Werte (Stand: 17.07.2026), Referenz:
# http://juerg5524.ch/data/ElsterTable.inc
#
# Frame-Format (7 Byte Nutzdaten):
#   Kurzer Index (<=0xFF):     [Cmd][00][Idx][Wert_hi][Wert_lo][00][00]
#   Erweiterter Index (>0xFF): [Cmd][00][FA][Idx_hi][Idx_lo][Wert_hi][Wert_lo]
#
# Bestaetigte Zuordnungen:
#   AUSSENTEMP                 Index 0x000C  CAN 0x180/0x100        /10 =>degC
#   SPEICHERISTTEMP (WW-Ist)   Index 0x000E  CAN 0x180/0x100/0x201  /10 =>degC
#   EINSTELL_SPEICHERSOLLTEMP  Index 0x0013  CAN 0x100/0x201        /10 =>degC
#   RUECKLAUFISTTEMP           Index 0x0016  CAN 0x514              /10 =>degC
#   MELDUNGSLISTE (Anlage)     Index 0x4F0B  CAN 0x100              Ganzzahl
#   MELDUNGSLISTE (Waermepumpe)Index 0x4F0C  CAN 0x480              Ganzzahl
#   VORLAUFISTTEMP WP          Index 0xFDF3  CAN 0x700/0x500        /10 =>degC
#   RAUMTEMPERATUR (Fernfuehl.)Index 0x4EC7  CAN 0x401              /10 =>degC
#   RAUMLUFTFEUCHTE (Fernfuehl)Index 0x4EC8  CAN 0x401              /10 =>%
#   BETRIEBSART                Index 0x4F1B  CAN 0x100/0x480        1=Bereitschaft,2=Programm,
#                                                                    3=Komfort,4=Eco,5=Warmwasser,6=Not
#   STEIGUNG HEIZKURVE         Index 0x4F2B  CAN 0x100/0x601        /100 => Steigung (z.B. 40=>0,40)
#   KOMFORTTEMPERATUR (HK)     Index 0x4EB8  CAN 0x100/0x601        /10 =>degC
#   ECO-TEMPERATUR (HK)        Index 0x4EB9  CAN 0x100/0x601        /10 =>degC
#
# Aktives Polling: RUECKLAUFISTTEMP und WW-SOLL werden nur bei
# Menue-Aufruf am WPM oder Wertaenderung gesendet. Damit wir nicht
# ans Display gehen muessen, fragen wir sie selbst periodisch ab,
# ueber CAN-ID 0x680 ("PC"/ComfortSoft-Kanal, laut Doku fuer externe
# Tools reserviert und bei uns unbenutzt -> keine Kollision mit
# echten Geraeten auf dem Bus).
# =========================================================================

globals:
  - id: frame_count
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: last_betriebsart
    type: int16_t
    restore_value: false
    initial_value: '0'
  - id: last_steigung_heizkurve
    type: int16_t
    restore_value: false
    initial_value: '0'
  # Energiezaehler: MWh-Teil zwischenspeichern, um ihn beim Eintreffen des
  # kWh-Teils zum Gesamtwert (kWh = MWh*1000 + kWh) zu kombinieren.
  - id: g_wm_heiz_vd_mwh
    type: int16_t
    restore_value: false
    initial_value: '0'
  - id: g_wm_ww_vd_mwh
    type: int16_t
    restore_value: false
    initial_value: '0'
  - id: g_wm_heiz_nhz_mwh
    type: int16_t
    restore_value: false
    initial_value: '0'
  - id: g_wm_ww_nhz_mwh
    type: int16_t
    restore_value: false
    initial_value: '0'
  - id: g_el_heiz_vd_mwh
    type: int16_t
    restore_value: false
    initial_value: '0'
  - id: g_el_ww_vd_mwh
    type: int16_t
    restore_value: false
    initial_value: '0'
  # Gesamtsystem 1-12M (Manager 0x480): MWh-Teil zwischenspeichern.
  - id: g_gs_wm_heiz_mwh
    type: int16_t
    restore_value: false
    initial_value: '0'
  - id: g_gs_wm_ww_mwh
    type: int16_t
    restore_value: false
    initial_value: '0'
  - id: g_gs_strom_heiz_mwh
    type: int16_t
    restore_value: false
    initial_value: '0'
  - id: g_gs_strom_ww_mwh
    type: int16_t
    restore_value: false
    initial_value: '0'
  # Verdichter-Starts: Tausender-Teil (0x4EF0) zwischenspeichern, mit
  # 0x4EF1 zum Gesamtwert (Starts = 0x4EF0*1000 + 0x4EF1) kombinieren.
  - id: g_starts_vd_k
    type: int16_t
    restore_value: false
    initial_value: '0'
  # Gesamtsystem 13-24M (Manager 0x480): MWh-Teil zwischenspeichern.
  - id: g_gs_wm_heiz_mwh_24
    type: int16_t
    restore_value: false
    initial_value: '0'
  - id: g_gs_wm_ww_mwh_24
    type: int16_t
    restore_value: false
    initial_value: '0'
  - id: g_gs_strom_heiz_mwh_24
    type: int16_t
    restore_value: false
    initial_value: '0'
  - id: g_gs_strom_ww_mwh_24
    type: int16_t
    restore_value: false
    initial_value: '0'

sensor:
  - platform: template
    name: "CAN Frame Count"
    id: can_frame_count
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 5s
    lambda: 'return id(frame_count);'

  - platform: template
    name: "Aussentemperatur"
    id: aussentemperatur
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    name: "Warmwasser Isttemperatur"
    id: ww_isttemperatur
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    name: "Warmwasser Solltemperatur"
    id: ww_solltemperatur
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    name: "Ruecklauftemperatur"
    id: ruecklauftemperatur
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    name: "Meldungsliste Anlage"
    id: meldungsliste_anlage
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: template
    name: "Meldungsliste Waermepumpe"
    id: meldungsliste_wp
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: template
    name: "Vorlauftemperatur Waermepumpe"
    id: vorlauftemperatur_wp
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    name: "Raumtemperatur"
    id: raumtemperatur
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    name: "Raumluftfeuchte"
    id: raumluftfeuchte
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    name: "Betriebsart Code"
    id: betriebsart_code
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: template
    name: "Steigung Heizkurve"
    entity_category: diagnostic
    id: steigung_heizkurve
    accuracy_decimals: 2
    state_class: measurement

  - platform: template
    name: "Komforttemperatur Heizkreis"
    entity_category: diagnostic
    id: komforttemperatur_hk
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    name: "Eco-Temperatur Heizkreis"
    entity_category: diagnostic
    id: ecotemperatur_hk
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  # Minimal-Temperatur HK (0x4EA7) wird als Text-Sensor dargestellt
  # ("Aus" bzw. "18.0 °C"), siehe text_sensor-Block. Gesetzt ueber den
  # Schieber "Minimal Temperatur Heizkreis setzen" (0 = Aus).
  - platform: template
    name: "Raumeinfluss Heizkreis"
    entity_category: diagnostic
    id: raumeinfluss_hk
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0

  # --- Kuehlen (Menue Einstellungen->Kuehlen), 30.07.2026 geraetegelesen ---
  # Kuehlkreis 1 liegt auf Modul 0x601 (wie Heizkurve); Hysterese/Leistung
  # auf eigenen Modulen (0x180/0x480). Nur-Lese-Sensoren, kein Schreiben.
  - platform: template
    name: "Raumsolltemperatur Kuehlen"
    entity_category: diagnostic
    id: raumsolltemp_kuehlen
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    name: "Steigung Kuehlkurve"
    entity_category: diagnostic
    id: steigung_kuehlkurve
    accuracy_decimals: 2
    state_class: measurement

  - platform: template
    name: "Starttemperatur Kuehlen"
    entity_category: diagnostic
    id: starttemp_kuehlen
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    name: "Hysterese Vorlauf Kuehlen"
    entity_category: diagnostic
    id: hysterese_vorlauf_kuehlen
    unit_of_measurement: "K"
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    name: "Leistung Kuehlen"
    entity_category: diagnostic
    id: leistung_kuehlen
    unit_of_measurement: "kW"
    device_class: power
    state_class: measurement
    accuracy_decimals: 1

  # --- Energiezaehler (Summe seit Inbetriebnahme) ---
  # Kombiniert aus MWh- und kWh-Register (kWh = MWh*1000 + kWh).
  # device_class energy + total_increasing => direkt im HA-Energy-Dashboard.
  # Bestaetigt 29.07.2026 (Sniffer + Display-Gegencheck), Antwort auf 0x500.
  # 2WE = zweiter Waermeerzeuger = elektrische Nacherwaermung (NHZ).
  - platform: template
    name: "Waermemenge Heizen VD"
    entity_category: diagnostic
    id: wm_heiz_vd
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 0

  - platform: template
    name: "Waermemenge Warmwasser VD"
    entity_category: diagnostic
    id: wm_ww_vd
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 0

  - platform: template
    name: "Waermemenge Heizen NHZ"
    entity_category: diagnostic
    id: wm_heiz_nhz
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 0

  - platform: template
    name: "Waermemenge Warmwasser NHZ"
    entity_category: diagnostic
    id: wm_ww_nhz
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 0

  - platform: template
    name: "Stromaufnahme Heizen VD"
    entity_category: diagnostic
    id: el_heiz_vd
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 0

  - platform: template
    name: "Stromaufnahme Warmwasser VD"
    entity_category: diagnostic
    id: el_ww_vd
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 0

  # --- Gesamtsystem-Energiebilanz, rollende letzte 12 Monate (Manager 0x480) ---
  # Kombiniert MWh+kWh. Rollendes Fenster -> state_class measurement (kann
  # sinken, daher NICHT total_increasing). Display-verifiziert 29.07.2026
  # (Info->Energiebilanz->Gesamtsystem). COP wird HA-seitig berechnet.
  - platform: template
    name: "Gesamt Waermemenge Heizen 12M"
    entity_category: diagnostic
    id: gs_wm_heiz
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: measurement
    accuracy_decimals: 0

  - platform: template
    name: "Gesamt Waermemenge Warmwasser 12M"
    entity_category: diagnostic
    id: gs_wm_ww
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: measurement
    accuracy_decimals: 0

  - platform: template
    name: "Gesamt Stromverbrauch Heizen 12M"
    entity_category: diagnostic
    id: gs_strom_heiz
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: measurement
    accuracy_decimals: 0

  - platform: template
    name: "Gesamt Stromverbrauch Warmwasser 12M"
    entity_category: diagnostic
    id: gs_strom_ww
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: measurement
    accuracy_decimals: 0

  # --- Laufzeiten (IWS 0x514), Indizes 29.07.2026 display-bestaetigt ---
  # Betriebsstunden -> nur steigend (total_increasing), device_class duration.
  - platform: template
    name: "Laufzeit VD Heizen"
    entity_category: diagnostic
    id: laufzeit_vd_heizen
    unit_of_measurement: "h"
    device_class: duration
    state_class: total_increasing
    accuracy_decimals: 0
  - platform: template
    name: "Laufzeit VD Warmwasser"
    entity_category: diagnostic
    id: laufzeit_vd_ww
    unit_of_measurement: "h"
    device_class: duration
    state_class: total_increasing
    accuracy_decimals: 0
  - platform: template
    name: "Laufzeit NHZ 1"
    entity_category: diagnostic
    id: laufzeit_nhz1
    unit_of_measurement: "h"
    device_class: duration
    state_class: total_increasing
    accuracy_decimals: 0
  - platform: template
    name: "Laufzeit NHZ 2"
    entity_category: diagnostic
    id: laufzeit_nhz2
    unit_of_measurement: "h"
    device_class: duration
    state_class: total_increasing
    accuracy_decimals: 0
  - platform: template
    name: "Laufzeit NHZ 1+2"
    entity_category: diagnostic
    id: laufzeit_nhz12
    unit_of_measurement: "h"
    device_class: duration
    state_class: total_increasing
    accuracy_decimals: 0
  - platform: template
    name: "Laufzeit Passivkuehlung"
    entity_category: diagnostic
    id: laufzeit_passivkuehlung
    unit_of_measurement: "h"
    device_class: duration
    state_class: total_increasing
    accuracy_decimals: 0

  # --- Starts (IWS 0x514): Verdichter, Split 0x4EF0*1000 + 0x4EF1 ---
  - platform: template
    name: "Verdichter Starts"
    entity_category: diagnostic
    id: verdichter_starts
    state_class: total_increasing
    accuracy_decimals: 0

  # --- Prozessdaten-Vorlauftemperatur (IWS 0x514, Index 0x01D6) ---
  # Interner WP-Vorlauf (Elster WPVORLAUFIST); kann mit "Vorlauftemperatur
  # Waermepumpe" (0xFDF3) deckungsgleich sein - hier separat als Prozessdatum.
  - platform: template
    name: "Vorlauftemperatur Prozessdaten"
    entity_category: diagnostic
    id: vorlauftemp_pd
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  # --- Gesamtsystem-Energiebilanz 13-24M (Manager 0x480) ---
  # Vorjahresfenster, rollend -> measurement (nicht total_increasing).
  - platform: template
    name: "Gesamt Waermemenge Heizen 13-24M"
    entity_category: diagnostic
    id: gs_wm_heiz_24
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: measurement
    accuracy_decimals: 0
  - platform: template
    name: "Gesamt Waermemenge Warmwasser 13-24M"
    entity_category: diagnostic
    id: gs_wm_ww_24
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: measurement
    accuracy_decimals: 0
  - platform: template
    name: "Gesamt Stromverbrauch Heizen 13-24M"
    entity_category: diagnostic
    id: gs_strom_heiz_24
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: measurement
    accuracy_decimals: 0
  - platform: template
    name: "Gesamt Stromverbrauch Warmwasser 13-24M"
    entity_category: diagnostic
    id: gs_strom_ww_24
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: measurement
    accuracy_decimals: 0

  # --- Effizienz/COP (Manager 0x480, /100) - Geraete-eigene Werte ---
  # Hinweis: fuer 1-12M gibt es zusaetzlich HA-seitig berechenbaren COP aus
  # Waerme/Strom; hier die Anzeige-Werte des Geraets direkt.
  - platform: template
    name: "Effizienz Heizen 12M"
    entity_category: diagnostic
    id: gs_cop_heiz_12
    state_class: measurement
    accuracy_decimals: 2
  - platform: template
    name: "Effizienz Warmwasser 12M"
    entity_category: diagnostic
    id: gs_cop_ww_12
    state_class: measurement
    accuracy_decimals: 2
  - platform: template
    name: "Effizienz Warmwasser 13-24M"
    entity_category: diagnostic
    id: gs_cop_ww_24
    state_class: measurement
    accuracy_decimals: 2

  # --- Prozessdaten (IWS 0x514), bestaetigt 29.07.2026 ---
  # Kaeltekreis-Temperaturen
  - platform: template
    name: "Verdampfertemperatur"
    entity_category: diagnostic
    id: verdampfertemperatur
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    name: "Verdichtereintrittstemperatur"
    entity_category: diagnostic
    id: verdichtereintrittstemp
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    name: "Heissgastemperatur"
    entity_category: diagnostic
    id: heissgastemperatur
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    name: "Verfluessigertemperatur"
    entity_category: diagnostic
    id: verfluessigertemperatur
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    name: "Oelsumpftemperatur"
    entity_category: diagnostic
    id: oelsumpftemperatur
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  # Kaeltekreis-Druecke (/100 bar)
  - platform: template
    name: "Druck Niederdruck"
    entity_category: diagnostic
    id: druck_niederdruck
    unit_of_measurement: "bar"
    device_class: pressure
    state_class: measurement
    accuracy_decimals: 2

  - platform: template
    name: "Druck Hochdruck"
    entity_category: diagnostic
    id: druck_hochdruck
    unit_of_measurement: "bar"
    device_class: pressure
    state_class: measurement
    accuracy_decimals: 2

  - platform: template
    name: "Wasservolumenstrom"
    entity_category: diagnostic
    id: wp_volumenstrom
    unit_of_measurement: "L/min"
    device_class: volume_flow_rate
    state_class: measurement
    accuracy_decimals: 1

  # Inverter / Verdichter
  - platform: template
    name: "Strom Inverter"
    entity_category: diagnostic
    id: strom_inverter
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    name: "Spannung Inverter"
    entity_category: diagnostic
    id: spannung_inverter
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1

  # Ist/Soll-Zuordnung 0x06EB/0x06EC noch nicht verifiziert (siehe docs)
  - platform: template
    name: "Istdrehzahl Verdichter"
    entity_category: diagnostic
    id: istdrehzahl_verdichter
    unit_of_measurement: "Hz"
    device_class: frequency
    state_class: measurement
    accuracy_decimals: 0

  - platform: template
    name: "Solldrehzahl Verdichter"
    entity_category: diagnostic
    id: solldrehzahl_verdichter
    unit_of_measurement: "Hz"
    device_class: frequency
    state_class: measurement
    accuracy_decimals: 0

  # Waermequelle (Sole)
  - platform: template
    name: "Waermequelle Vorlauftemperatur"
    entity_category: diagnostic
    id: wq_vorlauf
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    name: "Waermequelle Ruecklauftemperatur"
    entity_category: diagnostic
    id: wq_ruecklauf
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    name: "Waermequellendruck"
    entity_category: diagnostic
    id: wq_druck
    unit_of_measurement: "bar"
    device_class: pressure
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    name: "Leistung Waermequellenpumpe"
    entity_category: diagnostic
    id: wq_pumpenleistung
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 1

text_sensor:
  - platform: template
    name: "Betriebsart"
    entity_category: diagnostic
    id: betriebsart_text

  # --- Kuehlen: Schalter/Enums (30.07.2026 wert-bestaetigt) ---
  - platform: template
    name: "Kuehlen"
    entity_category: diagnostic
    id: kuehlen_status
  - platform: template
    name: "Kuehlkreis 1"
    entity_category: diagnostic
    id: kuehlkreis_status
  - platform: template
    name: "Kuehlart"
    entity_category: diagnostic
    id: kuehlart_text

  # Minimal-Temperatur HK (0x4EA7) als Text: "Aus" (Sonderwert 0x9000)
  # oder die Temperatur ("18.0 °C"). Gesetzt ueber den gleichnamigen Schieber.
  - platform: template
    name: "Minimal Temperatur Heizkreis"
    entity_category: diagnostic
    id: min_temp_hk_txt

canbus:
  - platform: esp32_can
    id: my_canbus
    tx_pin: GPIO15
    rx_pin: GPIO16
    can_id: 0
    bit_rate: ${can_bitrate}
    on_frame:
      - can_id: 0
        can_id_mask: 0
        use_extended_id: false
        then:
          - lambda: |-
              id(frame_count) += 1;

              if (x.size() < 7) return;

              // WICHTIG (Fix 21.07.2026): Lese-ANFRAGEN enthalten im
              // Wertefeld immer 0 und duerfen NICHT als Messwert publiziert
              // werden. Anfragen erkennt man am unteren Halbbyte des
              // Cmd-Bytes == 1 (z.B. 0x41, 0xA1, 0x91, 0x31). Antworten/
              // Broadcasts haben dort 0 oder 2 (z.B. 0x22, 0x20, 0x80).
              // Ohne diesen Filter sprangen Sensoren sporadisch auf 0,
              // sobald die WPM intern denselben Index angefragt hat.
              if ((x[0] & 0x0F) == 0x01) return;

              // Cmd-Byte wird für uns nicht gebraucht, nur Index+Wert
              uint16_t idx;
              int16_t val;

              if (x[2] == 0xFA) {
                // Erweiterter Index: Byte 3-4 = Index, Byte 5-6 = Wert
                idx = (x[3] << 8) | x[4];
                val = (int16_t)((x[5] << 8) | x[6]);
              } else {
                // Kurzer Index: Byte 2 = Index, Byte 3-4 = Wert
                idx = x[2];
                val = (int16_t)((x[3] << 8) | x[4]);
              }

              // --- AUSSENTEMP: Index 0x000C auf 0x180 oder 0x100 ---
              if (idx == 0x000C && (can_id == 0x180 || can_id == 0x100)) {
                id(aussentemperatur).publish_state(val / 10.0f);
              }

              // --- SPEICHERISTTEMP (WW-Ist): Index 0x000E auf 0x180/0x100/0x201 ---
              if (idx == 0x000E && (can_id == 0x180 || can_id == 0x100 || can_id == 0x201)) {
                id(ww_isttemperatur).publish_state(val / 10.0f);
              }

              // --- EINSTELL_SPEICHERSOLLTEMP: Index 0x0013 auf 0x100/0x201 ---
              if (idx == 0x0013 && (can_id == 0x100 || can_id == 0x201)) {
                id(ww_solltemperatur).publish_state(val / 10.0f);
              }

              // --- RUECKLAUFISTTEMP: Index 0x0016 auf 0x514 ---
              if (idx == 0x0016 && can_id == 0x514) {
                id(ruecklauftemperatur).publish_state(val / 10.0f);
              }

              // --- MELDUNGSLISTE: Index 0x4F0B (Anlage) / 0x4F0C (Waermepumpe) ---
              if (idx == 0x4F0B && can_id == 0x100) {
                id(meldungsliste_anlage).publish_state(val);
              }
              if (idx == 0x4F0C && can_id == 0x480) {
                id(meldungsliste_wp).publish_state(val);
              }

              // --- VORLAUFISTTEMP WP: Index 0xFDF3 auf 0x700/0x500 ---
              if (idx == 0xFDF3 && (can_id == 0x700 || can_id == 0x500)) {
                id(vorlauftemperatur_wp).publish_state(val / 10.0f);
              }

              // --- RAUMTEMPERATUR / RAUMLUFTFEUCHTE: Index 0x4EC7/0x4EC8 auf 0x401 ---
              if (idx == 0x4EC7 && can_id == 0x401) {
                id(raumtemperatur).publish_state(val / 10.0f);
              }
              if (idx == 0x4EC8 && can_id == 0x401) {
                id(raumluftfeuchte).publish_state(val / 10.0f);
              }

              // --- BETRIEBSART: Index 0x4F1B auf 0x100/0x480 ---
              // 1=Bereitschaft, 2=Programm, 3=Komfort, 4=Eco, 5=Warmwasser, 6=Not
              if (idx == 0x4F1B && (can_id == 0x100 || can_id == 0x480)) {
                id(betriebsart_code).publish_state(val);
                id(last_betriebsart) = val;
                std::string mode_name;
                switch (val) {
                  case 1: mode_name = "Bereitschaftsbetrieb"; break;
                  case 2: mode_name = "Programmbetrieb"; break;
                  case 3: mode_name = "Komfortbetrieb"; break;
                  case 4: mode_name = "Eco-Betrieb"; break;
                  case 5: mode_name = "Warmwasserbetrieb"; break;
                  case 6: mode_name = "Not-Betrieb"; break;
                  default: mode_name = "Unbekannt (" + std::to_string(val) + ")"; break;
                }
                id(betriebsart_text).publish_state(mode_name);
                // Dropdown nur bei den 5 steuerbaren Optionen mitziehen
                // (Not-Betrieb ist bewusst nicht im select enthalten)
                if (val >= 1 && val <= 5) {
                  id(betriebsart_select).publish_state(mode_name);
                }
              }

              // --- STEIGUNG HEIZKURVE: Index 0x4F2B auf 0x100/0x601 ---
              if (idx == 0x4F2B && (can_id == 0x100 || can_id == 0x601)) {
                id(steigung_heizkurve).publish_state(val / 100.0f);
                id(last_steigung_heizkurve) = val;
                id(steigung_heizkurve_set).publish_state(val / 100.0f);
              }

              // --- KOMFORTTEMPERATUR / ECO-TEMPERATUR Heizkreis: Index 0x4EB8/0x4EB9 auf 0x100/0x601 ---
              // Schreiben ueber 0x680 mit C0 01 FA 4E B8/B9 (Modul 0x601,
              // Nibble 0 = Setzen), abgeleitet aus dem bestaetigten Heizkurven-
              // Write. set-Entities unten; Rueckmeldung wird hier gespiegelt.
              if (idx == 0x4EB8 && (can_id == 0x100 || can_id == 0x601)) {
                id(komforttemperatur_hk).publish_state(val / 10.0f);
                id(komforttemperatur_hk_set).publish_state(val / 10.0f);
              }
              if (idx == 0x4EB9 && (can_id == 0x100 || can_id == 0x601)) {
                id(ecotemperatur_hk).publish_state(val / 10.0f);
                id(ecotemperatur_hk_set).publish_state(val / 10.0f);
              }

              // --- MINIMAL TEMPERATUR HK: Index 0x4EA7 auf 0x100/0x601 ---
              // "Aus" wird als eigener Sonderwert 0x9000 (-28672) uebertragen.
              // Lesesensor -> NaN/unavailable, Schieber -> 0 (= "Aus"-Position).
              if (idx == 0x4EA7 && (can_id == 0x100 || can_id == 0x601)) {
                if (val == -28672) {
                  id(min_temp_hk_txt).publish_state("Aus");
                  id(min_temp_hk_set).publish_state(0);
                } else {
                  char buf[16];
                  snprintf(buf, sizeof(buf), "%.1f °C", val / 10.0f);
                  id(min_temp_hk_txt).publish_state(buf);
                  id(min_temp_hk_set).publish_state(val / 10.0f);
                }
              }
              // --- RAUMEINFLUSS HK: Index 0x4EA4 auf 0x100/0x601 (direkt %) ---
              if (idx == 0x4EA4 && (can_id == 0x100 || can_id == 0x601)) {
                id(raumeinfluss_hk).publish_state(val);
                id(raumeinfluss_hk_set).publish_state(val);
              }

              // --- KUEHLEN: Kuehlkreis 1 (Modul 0x601, wie Heizkreis) ---
              // Indizes 30.07.2026 geraetegelesen (logs/kuehlen-read.log,
              // logs/kuehlart-enum.log). Nur Lesen.
              if (idx == 0x4F04 && (can_id == 0x100 || can_id == 0x601)) {
                id(raumsolltemp_kuehlen).publish_state(val / 10.0f);
                id(raumsolltemp_kuehlen_set).publish_state(val / 10.0f);
              }
              if (idx == 0x4FB9 && (can_id == 0x100 || can_id == 0x601)) {
                id(steigung_kuehlkurve).publish_state(val / 100.0f);
                id(steigung_kuehlkurve_set).publish_state(val / 100.0f);
              }
              if (idx == 0x4FBE && (can_id == 0x100 || can_id == 0x601)) {
                id(starttemp_kuehlen).publish_state(val / 10.0f);
                id(starttemp_kuehlen_set).publish_state(val / 10.0f);
              }
              if (idx == 0x4F08 && (can_id == 0x100 || can_id == 0x601)) {
                id(kuehlkreis_status).publish_state(val == 1 ? "Ein" : "Aus");
                id(kuehlkreis_select).publish_state(val == 1 ? "Ein" : "Aus");
              }
              if (idx == 0x4F05 && (can_id == 0x100 || can_id == 0x601)) {
                std::string art;
                switch (val) {
                  case 1: art = "Flaechenkuehlung"; break;
                  case 0: art = "Geblaesekuehlung"; break;
                  default: art = "Unbekannt (" + std::to_string(val) + ")"; break;
                }
                id(kuehlart_text).publish_state(art);
                if (val == 0 || val == 1) id(kuehlart_select).publish_state(art);
              }

              // --- KUEHLEN: uebergeordneter Schalter + Grundeinstellung ---
              // Diese liegen NICHT auf 0x601: 0x4F07/0x4F00 auf 0x180,
              // 0x7A40 auf 0x480 (30.07.2026 bestaetigt).
              if (idx == 0x4F07 && (can_id == 0x100 || can_id == 0x180)) {
                id(kuehlen_status).publish_state(val == 1 ? "Ein" : "Aus");
                id(kuehlen_select).publish_state(val == 1 ? "Ein" : "Aus");
              }
              if (idx == 0x4F00 && (can_id == 0x100 || can_id == 0x180)) {
                id(hysterese_vorlauf_kuehlen).publish_state(val / 10.0f);
                id(hysterese_vorlauf_kuehlen_set).publish_state(val / 10.0f);
              }
              if (idx == 0x7A40 && (can_id == 0x100 || can_id == 0x480)) {
                id(leistung_kuehlen).publish_state(val / 10.0f);
              }

              // --- ENERGIEZAEHLER (Summe) auf CAN-ID 0x514 (IWS) ---
              // WICHTIG (Korrektur 29.07. abends): dieselben Indizes existieren
              // auch auf 0x500 (Heizmodul) mit ABWEICHENDEN Werten. Die
              // IWS-Werte (0x514) entsprechen dem Display inkl. NHZ-Zaehlern,
              // deshalb wird hier NUR 0x514 dekodiert.
              // Zwei Register je Zaehler: MWh (ganze MWh) + kWh (0-999 Rest).
              // MWh-Teil merken, beim kWh-Teil kombiniert publizieren:
              // kWh_gesamt = MWh*1000 + kWh.
              // Waermemenge Heizen VD: MWh 0x0931 / kWh 0x0930
              if (idx == 0x0931 && can_id == 0x514) { id(g_wm_heiz_vd_mwh) = val; }
              if (idx == 0x0930 && can_id == 0x514) {
                id(wm_heiz_vd).publish_state((float)id(g_wm_heiz_vd_mwh) * 1000.0f + val);
              }
              // Waermemenge Warmwasser VD: MWh 0x092D / kWh 0x092C
              if (idx == 0x092D && can_id == 0x514) { id(g_wm_ww_vd_mwh) = val; }
              if (idx == 0x092C && can_id == 0x514) {
                id(wm_ww_vd).publish_state((float)id(g_wm_ww_vd_mwh) * 1000.0f + val);
              }
              // Waermemenge Heizen NHZ (2WE): MWh 0x0929 / kWh 0x0928
              if (idx == 0x0929 && can_id == 0x514) { id(g_wm_heiz_nhz_mwh) = val; }
              if (idx == 0x0928 && can_id == 0x514) {
                id(wm_heiz_nhz).publish_state((float)id(g_wm_heiz_nhz_mwh) * 1000.0f + val);
              }
              // Waermemenge Warmwasser NHZ (2WE): MWh 0x0925 / kWh 0x0924
              if (idx == 0x0925 && can_id == 0x514) { id(g_wm_ww_nhz_mwh) = val; }
              if (idx == 0x0924 && can_id == 0x514) {
                id(wm_ww_nhz).publish_state((float)id(g_wm_ww_nhz_mwh) * 1000.0f + val);
              }
              // Stromaufnahme Heizen VD: MWh 0x0921 / kWh 0x0920
              if (idx == 0x0921 && can_id == 0x514) { id(g_el_heiz_vd_mwh) = val; }
              if (idx == 0x0920 && can_id == 0x514) {
                id(el_heiz_vd).publish_state((float)id(g_el_heiz_vd_mwh) * 1000.0f + val);
              }
              // Stromaufnahme Warmwasser VD: MWh 0x091D / kWh 0x091C
              if (idx == 0x091D && can_id == 0x514) { id(g_el_ww_vd_mwh) = val; }
              if (idx == 0x091C && can_id == 0x514) {
                id(el_ww_vd).publish_state((float)id(g_el_ww_vd_mwh) * 1000.0f + val);
              }

              // --- PROZESSDATEN auf CAN-ID 0x514 (IWS), bestaetigt 29.07.2026 ---
              if (idx == 0x07A9 && can_id == 0x514) { id(verdampfertemperatur).publish_state(val / 10.0f); }
              if (idx == 0x06D9 && can_id == 0x514) { id(verdichtereintrittstemp).publish_state(val / 10.0f); }
              if (idx == 0x0265 && can_id == 0x514) { id(heissgastemperatur).publish_state(val / 10.0f); }
              if (idx == 0x0A39 && can_id == 0x514) { id(verfluessigertemperatur).publish_state(val / 10.0f); }
              if (idx == 0x0A37 && can_id == 0x514) { id(oelsumpftemperatur).publish_state(val / 10.0f); }
              if (idx == 0x07A7 && can_id == 0x514) { id(druck_niederdruck).publish_state(val / 100.0f); }
              if (idx == 0x07A6 && can_id == 0x514) { id(druck_hochdruck).publish_state(val / 100.0f); }
              if (idx == 0x02E2 && can_id == 0x514) { id(wp_volumenstrom).publish_state(val / 10.0f); }
              if (idx == 0x06B2 && can_id == 0x514) { id(strom_inverter).publish_state(val / 10.0f); }
              if (idx == 0x06B1 && can_id == 0x514) { id(spannung_inverter).publish_state(val / 10.0f); }
              // Ist/Soll-Zuordnung der beiden Drehzahl-Register noch NICHT
              // verifiziert (0x06EB/0x06EC, siehe docs) - bei Abgleich pruefen!
              if (idx == 0x06EB && can_id == 0x514) { id(istdrehzahl_verdichter).publish_state(val); }
              if (idx == 0x06EC && can_id == 0x514) { id(solldrehzahl_verdichter).publish_state(val); }
              if (idx == 0x4FA6 && can_id == 0x514) { id(wq_ruecklauf).publish_state(val / 10.0f); }
              if (idx == 0x4FA7 && can_id == 0x514) { id(wq_vorlauf).publish_state(val / 10.0f); }
              if (idx == 0x4FA8 && can_id == 0x514) { id(wq_druck).publish_state(val / 10.0f); }
              if (idx == 0x4FA9 && can_id == 0x514) { id(wq_pumpenleistung).publish_state(val / 10.0f); }

              // --- Prozessdaten-Vorlauf + Laufzeiten + Starts (IWS 0x514) ---
              if (idx == 0x01D6 && can_id == 0x514) { id(vorlauftemp_pd).publish_state(val / 10.0f); }
              if (idx == 0x4EFB && can_id == 0x514) { id(laufzeit_vd_heizen).publish_state(val); }
              if (idx == 0x4EFD && can_id == 0x514) { id(laufzeit_vd_ww).publish_state(val); }
              if (idx == 0x0259 && can_id == 0x514) { id(laufzeit_nhz1).publish_state(val); }
              if (idx == 0x025A && can_id == 0x514) { id(laufzeit_nhz2).publish_state(val); }
              if (idx == 0x0805 && can_id == 0x514) { id(laufzeit_nhz12).publish_state(val); }
              if (idx == 0x4F9A && can_id == 0x514) { id(laufzeit_passivkuehlung).publish_state(val); }
              // Verdichter-Starts: 0x4EF0 (Tausender) puffern, mit 0x4EF1 kombinieren
              if (idx == 0x4EF0 && can_id == 0x514) { id(g_starts_vd_k) = val; }
              if (idx == 0x4EF1 && can_id == 0x514) {
                id(verdichter_starts).publish_state((float)id(g_starts_vd_k) * 1000.0f + val);
              }

              // --- GESAMTSYSTEM 1-12M (Energiebilanz) auf CAN-ID 0x480 (Manager) ---
              // MWh+kWh kombiniert, rollendes 12-Monats-Fenster.
              // Waermemenge Heizen: MWh 0x5007 / kWh 0x5008
              if (idx == 0x5007 && can_id == 0x480) { id(g_gs_wm_heiz_mwh) = val; }
              if (idx == 0x5008 && can_id == 0x480) {
                id(gs_wm_heiz).publish_state((float)id(g_gs_wm_heiz_mwh) * 1000.0f + val);
              }
              // Waermemenge Warmwasser: MWh 0x500F / kWh 0x5010
              if (idx == 0x500F && can_id == 0x480) { id(g_gs_wm_ww_mwh) = val; }
              if (idx == 0x5010 && can_id == 0x480) {
                id(gs_wm_ww).publish_state((float)id(g_gs_wm_ww_mwh) * 1000.0f + val);
              }
              // Stromverbrauch Heizen: MWh 0x5013 / kWh 0x5014
              if (idx == 0x5013 && can_id == 0x480) { id(g_gs_strom_heiz_mwh) = val; }
              if (idx == 0x5014 && can_id == 0x480) {
                id(gs_strom_heiz).publish_state((float)id(g_gs_strom_heiz_mwh) * 1000.0f + val);
              }
              // Stromverbrauch Warmwasser: MWh 0x501B / kWh 0x501C
              if (idx == 0x501B && can_id == 0x480) { id(g_gs_strom_ww_mwh) = val; }
              if (idx == 0x501C && can_id == 0x480) {
                id(gs_strom_ww).publish_state((float)id(g_gs_strom_ww_mwh) * 1000.0f + val);
              }

              // --- GESAMTSYSTEM 13-24M + Effizienz auf CAN-ID 0x480 (Manager) ---
              if (idx == 0x502C && can_id == 0x480) { id(g_gs_wm_heiz_mwh_24) = val; }
              if (idx == 0x502D && can_id == 0x480) {
                id(gs_wm_heiz_24).publish_state((float)id(g_gs_wm_heiz_mwh_24) * 1000.0f + val);
              }
              if (idx == 0x5030 && can_id == 0x480) { id(g_gs_wm_ww_mwh_24) = val; }
              if (idx == 0x5031 && can_id == 0x480) {
                id(gs_wm_ww_24).publish_state((float)id(g_gs_wm_ww_mwh_24) * 1000.0f + val);
              }
              if (idx == 0x5032 && can_id == 0x480) { id(g_gs_strom_heiz_mwh_24) = val; }
              if (idx == 0x5033 && can_id == 0x480) {
                id(gs_strom_heiz_24).publish_state((float)id(g_gs_strom_heiz_mwh_24) * 1000.0f + val);
              }
              if (idx == 0x5036 && can_id == 0x480) { id(g_gs_strom_ww_mwh_24) = val; }
              if (idx == 0x5037 && can_id == 0x480) {
                id(gs_strom_ww_24).publish_state((float)id(g_gs_strom_ww_mwh_24) * 1000.0f + val);
              }
              // Effizienz (÷100) - Geraete-eigene Anzeige-Werte
              if (idx == 0x501E && can_id == 0x480) { id(gs_cop_heiz_12).publish_state(val / 100.0f); }
              if (idx == 0x5022 && can_id == 0x480) { id(gs_cop_ww_12).publish_state(val / 100.0f); }
              if (idx == 0x503A && can_id == 0x480) { id(gs_cop_ww_24).publish_state(val / 100.0f); }

              // Rohdaten weiterhin ins Log, falls wir spaeter noch was
              // Unbekanntes nachverfolgen wollen
              ESP_LOGD("wpe_i", "id=0x%03X idx=0x%04X val=%d", can_id, idx, val);

              // TEMPORAER: zusaetzlich rohe Hex-Bytes loggen, um den
              // Schreib-Header (Byte0) bei echten Set-Befehlen zu sehen
              // (fuer Komforttemperatur-Schreib-Untersuchung 21.07.2026)
              char hexdump[32] = {0};
              char b[4];
              for (size_t i = 0; i < x.size(); i++) {
                sprintf(b, "%02X ", x[i]);
                strcat(hexdump, b);
              }
              ESP_LOGD("wpe_i_raw", "id=0x%03X raw=%s", can_id, hexdump);

# Aktives Polling ueber den PC/ComfortSoft-Kanal (0x680)
interval:
  - interval: 60s
    then:
      - lambda: |-
          // Anfrage RUECKLAUFISTTEMP (Index 0x16, kurzer Index)
          std::vector<uint8_t> req_ruecklauf = {0xA1, 0x14, 0x16, 0x00, 0x00, 0x00, 0x00};
          id(my_canbus).send_data(0x680, false, req_ruecklauf);
      - delay: 200ms
      - lambda: |-
          // Anfrage EINSTELL_SPEICHERSOLLTEMP (Index 0x13, kurzer Index)
          // Header 41 01 ist das echte, im Log beobachtete Anfragemuster
          // (die WPM selbst nutzt CAN-ID 0x100 dafuer - das vermeiden wir
          // wegen Kollisionsgefahr und bleiben bei unserer freien 0x680)
          std::vector<uint8_t> req_wwsoll = {0x41, 0x01, 0x13, 0x00, 0x00, 0x00, 0x00};
          id(my_canbus).send_data(0x680, false, req_wwsoll);
      - delay: 200ms
      - lambda: |-
          // Anfrage BETRIEBSART (Index 0x4F1B) - Fix 29.07. abends:
          // Alter Header 41 01 adressierte 0x201 (Bedienteil), das mit
          // -32768 antwortete. Betriebsart liegt aber auf dem Manager 0x480
          // -> Header 91 00 = ((0x480>>3)&0xF0)+1 / (0x480&0x1F). 91 00 ist
          // heute am Gesamtsystem (ebenfalls 0x480) geraeteverifiziert.
          std::vector<uint8_t> req_betriebsart = {0x91, 0x00, 0xFA, 0x4F, 0x1B, 0x00, 0x00};
          id(my_canbus).send_data(0x680, false, req_betriebsart);
      - delay: 200ms
      - lambda: |-
          // Anfragen STEIGUNG HEIZKURVE / KOMFORT- / ECO-TEMPERATUR
          // (Index 0x4F2B / 0x4EB8 / 0x4EB9) ueber das Mischermodul 0x601.
          // Header C1 01 = ((0x601>>3)&0xF0)+1 / (0x601&0x1F). Aus der heute
          // bestaetigten Adressierungsformel abgeleitet, am Geraet zu pruefen.
          std::vector<uint8_t> req_steig = {0xC1, 0x01, 0xFA, 0x4F, 0x2B, 0x00, 0x00};
          id(my_canbus).send_data(0x680, false, req_steig);
          std::vector<uint8_t> req_komf = {0xC1, 0x01, 0xFA, 0x4E, 0xB8, 0x00, 0x00};
          id(my_canbus).send_data(0x680, false, req_komf);
          std::vector<uint8_t> req_eco = {0xC1, 0x01, 0xFA, 0x4E, 0xB9, 0x00, 0x00};
          id(my_canbus).send_data(0x680, false, req_eco);
          // MINIMAL TEMPERATUR (0x4EA7) + RAUMEINFLUSS (0x4EA4), auch 0x601
          std::vector<uint8_t> req_mintemp = {0xC1, 0x01, 0xFA, 0x4E, 0xA7, 0x00, 0x00};
          id(my_canbus).send_data(0x680, false, req_mintemp);
          std::vector<uint8_t> req_raum = {0xC1, 0x01, 0xFA, 0x4E, 0xA4, 0x00, 0x00};
          id(my_canbus).send_data(0x680, false, req_raum);
      - lambda: |-
          // --- Kuehlen-Parameter ueber 0x680 abfragen ---
          // Kuehlkreis 1 auf Modul 0x601 (Header C1 01 = generate_read_id(0x601),
          // geraeteverifiziert): Raumsoll 0x4F04, Steigung 0x4FB9, Starttemp
          // 0x4FBE, Kuehlkreis Ein/Aus 0x4F08, KuehlART 0x4F05.
          std::vector<uint8_t> k1 = {0xC1, 0x01, 0xFA, 0x4F, 0x04, 0x00, 0x00};
          id(my_canbus).send_data(0x680, false, k1);
          std::vector<uint8_t> k2 = {0xC1, 0x01, 0xFA, 0x4F, 0xB9, 0x00, 0x00};
          id(my_canbus).send_data(0x680, false, k2);
          std::vector<uint8_t> k3 = {0xC1, 0x01, 0xFA, 0x4F, 0xBE, 0x00, 0x00};
          id(my_canbus).send_data(0x680, false, k3);
          std::vector<uint8_t> k4 = {0xC1, 0x01, 0xFA, 0x4F, 0x08, 0x00, 0x00};
          id(my_canbus).send_data(0x680, false, k4);
          std::vector<uint8_t> k5 = {0xC1, 0x01, 0xFA, 0x4F, 0x05, 0x00, 0x00};
          id(my_canbus).send_data(0x680, false, k5);
          // Leistung 0x7A40 auf Modul 0x480 (Header 91 00 = generate_read_id(0x480),
          // bereits fuer Betriebsart/Gesamtsystem geraeteverifiziert).
          std::vector<uint8_t> k6 = {0x91, 0x00, 0xFA, 0x7A, 0x40, 0x00, 0x00};
          id(my_canbus).send_data(0x680, false, k6);
          // KUEHLEN-Schalter 0x4F07 + Hysterese 0x4F00 auf Modul 0x180
          // (Header 31 00 = generate_read_id(0x180)). GERAETEBESTAETIGT
          // (30.07.2026, logs/kuehlen-verify.log): beide Indizes werden im
          // Poll-Takt beantwortet.
          std::vector<uint8_t> k7 = {0x31, 0x00, 0xFA, 0x4F, 0x07, 0x00, 0x00};
          id(my_canbus).send_data(0x680, false, k7);
          std::vector<uint8_t> k8 = {0x31, 0x00, 0xFA, 0x4F, 0x00, 0x00, 0x00};
          id(my_canbus).send_data(0x680, false, k8);
      # --- Energiezaehler (IWS 0x514) ueber 0x680 abfragen ---
      # Header A1 14 = IWS-Anfrage, geraeteverifiziert (Ruecklauf-Poll,
      # IWS antwortet mit Cmd D2 auf 0x514). Korrektur 29.07.: die IWS
      # fuehrt die Display-Zaehler inkl. NHZ; das Heizmodul (A1 00/0x500)
      # lieferte abweichende Werte. Pro Zaehler zuerst MWh, dann kWh
      # (Reihenfolge sichert korrekte Kombination).
      - delay: 200ms
      - lambda: |-
