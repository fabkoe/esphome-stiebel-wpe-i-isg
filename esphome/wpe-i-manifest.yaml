# =========================================================================
# Lokaler Flash-/Entwicklungsstand (PC/esptool).
# Bindet den wiederverwendbaren Kern (wpe-i-package.yaml) ein und ergaenzt
# nur die geraetespezifischen Netz-Zugangsdaten aus secrets.yaml.
# Flashen wie gehabt:  py -3.12 -m esphome run wpe-i-manifest.yaml
#
# Wer die Firmware als ESPHome-Package/Adopt nutzt, braucht diese Datei
# NICHT - dann liefert das Dashboard eine Mini-Config, die das Package
# per github:// referenziert (siehe README, Abschnitt Installation).
#
# VOLL-BUILD: bindet zusaetzlich wpe-i-writes.yaml ein (Schreib-Entities).
# Fuer einen echten Read-only-Build die zweite Zeile auskommentieren/weglassen.
# =========================================================================

packages:
  wpe_i: !include wpe-i-package.yaml
  wpe_i_writes: !include wpe-i-writes.yaml

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
