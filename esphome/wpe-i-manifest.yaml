      - delay: 200ms
      - lambda: |-
          // Volumenstrom + Inverter
          std::vector<uint8_t> r1 = {0xA1, 0x14, 0xFA, 0x02, 0xE2, 0x00, 0x00}; // Volumenstrom
          id(my_canbus).send_data(0x680, false, r1);
          std::vector<uint8_t> r2 = {0xA1, 0x14, 0xFA, 0x06, 0xB2, 0x00, 0x00}; // Strom Inverter
          id(my_canbus).send_data(0x680, false, r2);
          std::vector<uint8_t> r3 = {0xA1, 0x14, 0xFA, 0x06, 0xB1, 0x00, 0x00}; // Spannung Inverter
          id(my_canbus).send_data(0x680, false, r3);
          std::vector<uint8_t> r4 = {0xA1, 0x14, 0xFA, 0x06, 0xEB, 0x00, 0x00}; // Drehzahl (Ist?)
          id(my_canbus).send_data(0x680, false, r4);
          std::vector<uint8_t> r5 = {0xA1, 0x14, 0xFA, 0x06, 0xEC, 0x00, 0x00}; // Drehzahl (Soll?)
          id(my_canbus).send_data(0x680, false, r5);
      - delay: 200ms
      - lambda: |-
          // Waermequelle (Sole)
          std::vector<uint8_t> r1 = {0xA1, 0x14, 0xFA, 0x4F, 0xA6, 0x00, 0x00}; // WQ-Ruecklauf
          id(my_canbus).send_data(0x680, false, r1);
          std::vector<uint8_t> r2 = {0xA1, 0x14, 0xFA, 0x4F, 0xA7, 0x00, 0x00}; // WQ-Vorlauf
          id(my_canbus).send_data(0x680, false, r2);
          std::vector<uint8_t> r3 = {0xA1, 0x14, 0xFA, 0x4F, 0xA8, 0x00, 0x00}; // WQ-Druck
          id(my_canbus).send_data(0x680, false, r3);
          std::vector<uint8_t> r4 = {0xA1, 0x14, 0xFA, 0x4F, 0xA9, 0x00, 0x00}; // WQ-Pumpenleistung
          id(my_canbus).send_data(0x680, false, r4);
      - delay: 200ms
      - lambda: |-
          // Prozessdaten-Vorlauf (0x01D6) + Laufzeiten (Teil 1)
          std::vector<uint8_t> r1 = {0xA1, 0x14, 0xFA, 0x01, 0xD6, 0x00, 0x00}; // Vorlauf PD
          id(my_canbus).send_data(0x680, false, r1);
          std::vector<uint8_t> r2 = {0xA1, 0x14, 0xFA, 0x4E, 0xFB, 0x00, 0x00}; // Laufzeit VD Heizen
          id(my_canbus).send_data(0x680, false, r2);
          std::vector<uint8_t> r3 = {0xA1, 0x14, 0xFA, 0x4E, 0xFD, 0x00, 0x00}; // Laufzeit VD WW
          id(my_canbus).send_data(0x680, false, r3);
          std::vector<uint8_t> r4 = {0xA1, 0x14, 0xFA, 0x02, 0x59, 0x00, 0x00}; // Laufzeit NHZ1
          id(my_canbus).send_data(0x680, false, r4);
          std::vector<uint8_t> r5 = {0xA1, 0x14, 0xFA, 0x02, 0x5A, 0x00, 0x00}; // Laufzeit NHZ2
          id(my_canbus).send_data(0x680, false, r5);
      - delay: 200ms
      - lambda: |-
          // Laufzeiten (Teil 2) + Verdichter-Starts (Tausender 0x4EF0 VOR Rest 0x4EF1)
          std::vector<uint8_t> r1 = {0xA1, 0x14, 0xFA, 0x08, 0x05, 0x00, 0x00}; // Laufzeit NHZ1/2
          id(my_canbus).send_data(0x680, false, r1);
          std::vector<uint8_t> r2 = {0xA1, 0x14, 0xFA, 0x4F, 0x9A, 0x00, 0x00}; // Laufzeit Passivkuehlung
          id(my_canbus).send_data(0x680, false, r2);
          std::vector<uint8_t> r3 = {0xA1, 0x14, 0xFA, 0x4E, 0xF0, 0x00, 0x00}; // Starts (Tausender)
          id(my_canbus).send_data(0x680, false, r3);
          std::vector<uint8_t> r4 = {0xA1, 0x14, 0xFA, 0x4E, 0xF1, 0x00, 0x00}; // Starts (Rest)
          id(my_canbus).send_data(0x680, false, r4);

