# =========================================================================
# Local flash/development build (PC/esptool).
# Includes the reusable core (wpe-i-package.yaml) and adds
# only the device-specific network credentials from secrets.yaml.
# Flash as usual:  py -3.12 -m esphome run wpe-i-manifest.yaml
#
# Anyone using the firmware as an ESPHome package/adopt does NOT need
# this file - the dashboard then provides a mini config that references
# the package via github:// (see README, Installation section).
#
# FULL BUILD: additionally includes wpe-i-writes.yaml (write entities).
# For a true read-only build, comment out/omit the second line.
# =========================================================================

packages:
  wpe_i: !include wpe-i-package.yaml
  wpe_i_writes: !include wpe-i-writes.yaml

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
