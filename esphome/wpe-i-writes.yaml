          if (id(g_mode) < 2) { ESP_LOGW("wpe_mode", "Write blocked - access mode %d, full access (2) required", id(g_mode)); return; }
          int16_t v = (int16_t) round(x * 10.0f);
          uint8_t val_hi = (v >> 8) & 0xFF;
          uint8_t val_lo = v & 0xFF;
          std::vector<uint8_t> w = {0xC0, 0x01, 0xFA, 0x4F, 0x04, val_hi, val_lo};
          id(my_canbus).send_data(0x680, false, w);
          char txbuf[24];
          snprintf(txbuf, sizeof(txbuf), "%02X %02X %02X %02X %02X %02X %02X",
                   w[0], w[1], w[2], w[3], w[4], w[5], w[6]);
          ESP_LOGI("wpe_i", "TX id=0x680 raw=%s", txbuf);
          ESP_LOGI("wpe_i", "Room setpoint temperature cooling set to: %.1f (raw=%d)", x, v);
      - delay: 250ms
      - lambda: |-
          if (id(g_mode) < 2) return;  // write guard (read-back)
          std::vector<uint8_t> rb = {0xC1, 0x01, 0xFA, 0x4F, 0x04, 0x00, 0x00};
          id(my_canbus).send_data(0x680, false, rb);

  - platform: template
    name: "Set Cooling Curve Slope"
    entity_category: config
    id: steigung_kuehlkurve_set
    optimistic: false
    min_value: 0.1
    max_value: 3.0
    step: 0.05
    unit_of_measurement: ""
    set_action:
      - lambda: |-
          if (id(g_mode) < 2) { ESP_LOGW("wpe_mode", "Write blocked - access mode %d, full access (2) required", id(g_mode)); return; }
          int16_t v = (int16_t) round(x * 100.0f);
          uint8_t val_hi = (v >> 8) & 0xFF;
          uint8_t val_lo = v & 0xFF;
          std::vector<uint8_t> w = {0xC0, 0x01, 0xFA, 0x4F, 0xB9, val_hi, val_lo};
          id(my_canbus).send_data(0x680, false, w);
          char txbuf[24];
          snprintf(txbuf, sizeof(txbuf), "%02X %02X %02X %02X %02X %02X %02X",
                   w[0], w[1], w[2], w[3], w[4], w[5], w[6]);
          ESP_LOGI("wpe_i", "TX id=0x680 raw=%s", txbuf);
          ESP_LOGI("wpe_i", "Cooling curve slope set to: %.2f (raw=%d)", x, v);
      - delay: 250ms
      - lambda: |-
          if (id(g_mode) < 2) return;  // write guard (read-back)
          std::vector<uint8_t> rb = {0xC1, 0x01, 0xFA, 0x4F, 0xB9, 0x00, 0x00};
          id(my_canbus).send_data(0x680, false, rb);

  - platform: template
    name: "Set Start Temperature Cooling"
    entity_category: config
    id: starttemp_kuehlen_set
    optimistic: false
    min_value: 15.0
    max_value: 30.0
    step: 0.5
    unit_of_measurement: "°C"
    device_class: temperature
    set_action:
      - lambda: |-
          if (id(g_mode) < 2) { ESP_LOGW("wpe_mode", "Write blocked - access mode %d, full access (2) required", id(g_mode)); return; }
          int16_t v = (int16_t) round(x * 10.0f);
          uint8_t val_hi = (v >> 8) & 0xFF;
          uint8_t val_lo = v & 0xFF;
          std::vector<uint8_t> w = {0xC0, 0x01, 0xFA, 0x4F, 0xBE, val_hi, val_lo};
          id(my_canbus).send_data(0x680, false, w);
          char txbuf[24];
          snprintf(txbuf, sizeof(txbuf), "%02X %02X %02X %02X %02X %02X %02X",
                   w[0], w[1], w[2], w[3], w[4], w[5], w[6]);
          ESP_LOGI("wpe_i", "TX id=0x680 raw=%s", txbuf);
          ESP_LOGI("wpe_i", "Start temperature cooling set to: %.1f (raw=%d)", x, v);
      - delay: 250ms
      - lambda: |-
          if (id(g_mode) < 2) return;  // write guard (read-back)
          std::vector<uint8_t> rb = {0xC1, 0x01, 0xFA, 0x4F, 0xBE, 0x00, 0x00};
          id(my_canbus).send_data(0x680, false, rb);

