# =========================================================================
# Write entities (full access). ONLY for the full build - included
# via wpe-i-manifest.yaml IN ADDITION to wpe-i-package.yaml.
# If this file is not included, the firmware is physically read-only.
#
# Every write action is additionally guarded by g_mode >= 2 (operating mode
# "Full access"); in mode 0/1 the entities are inert.
# =========================================================================


# =========================================================================
# EXPERIMENTAL: write test for operating mode (index 0x4F1B)
#
# Format is based on a documented write example for another
# Elster index (PROGRAMMSCHALTER 0x0112) from the KNX user forum:
#   680: 32 00 fa 01 12 02 00
# "The '2' in 32 stands for writing"
# NOT verified whether byte0=0x32 also fits our index/our device;
# this button deliberately writes back ONLY the currently known value
# (no real change) - only to test whether the WPM accepts the
# write telegram at all (visible as a new
# broadcast on idx=0x4F1B shortly after in the log).
#
# ONLY once this test works cleanly (confirmation in the log, no
# errors, no unexpected system behaviour) should a real
# write service with a variable target value be built from it.
# =========================================================================
button:
  - platform: template
    name: "Operating Mode Test Write-Back"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          if (id(g_mode) < 2) { ESP_LOGW("wpe_mode", "Write blocked - access mode %d, full access (2) required", id(g_mode)); return; }
          int16_t v = id(last_betriebsart);
          if (v < 1 || v > 6) {
            ESP_LOGW("wpe_i", "Operating mode test aborted: no valid value known (%d)", v);
            return;
          }
          uint8_t val_hi = (v >> 8) & 0xFF;
          uint8_t val_lo = v & 0xFF;
          std::vector<uint8_t> write_betriebsart = {0x32, 0x00, 0xFA, 0x4F, 0x1B, val_hi, val_lo};
          id(my_canbus).send_data(0x680, false, write_betriebsart);
          char txbuf[24];
          snprintf(txbuf, sizeof(txbuf), "%02X %02X %02X %02X %02X %02X %02X",
                   write_betriebsart[0], write_betriebsart[1], write_betriebsart[2], write_betriebsart[3],
                   write_betriebsart[4], write_betriebsart[5], write_betriebsart[6]);
          ESP_LOGI("wpe_i", "TX id=0x680 raw=%s", txbuf);
          ESP_LOGI("wpe_i", "Operating mode test write sent: value=%d", v);

# =========================================================================
# Operating-mode control (index 0x4F1B) - writing confirmed on 19.07.2026:
# target=comfort(3) and target=eco(4) both tested successfully, each
# confirmed within ~820ms with the correct value on 0x480, no errors.
# =========================================================================
select:
  - platform: template
    name: "Set Operating Mode"
    entity_category: config
    id: betriebsart_select
    optimistic: false
    options:
      - "Standby"
      - "Program"
      - "Comfort"
      - "Eco"
      - "Hot water"
    set_action:
      - lambda: |-
          if (id(g_mode) < 2) { ESP_LOGW("wpe_mode", "Write blocked - access mode %d, full access (2) required", id(g_mode)); return; }
          uint8_t v = 0;
          if (x == "Standby") v = 1;
          else if (x == "Program") v = 2;
          else if (x == "Comfort") v = 3;
          else if (x == "Eco") v = 4;
          else if (x == "Hot water") v = 5;
          if (v == 0) {
            ESP_LOGW("wpe_i", "Set operating mode: unknown option '%s'", x.c_str());
            return;
          }
          std::vector<uint8_t> w = {0x32, 0x00, 0xFA, 0x4F, 0x1B, 0x00, v};
          id(my_canbus).send_data(0x680, false, w);
          char txbuf[24];
          snprintf(txbuf, sizeof(txbuf), "%02X %02X %02X %02X %02X %02X %02X",
                   w[0], w[1], w[2], w[3], w[4], w[5], w[6]);
          ESP_LOGI("wpe_i", "TX id=0x680 raw=%s", txbuf);
          ESP_LOGI("wpe_i", "Operating mode set to: %s (%d)", x.c_str(), v);

  # =======================================================================
  # Cooling circuit 1 on/off (0x4F08) + cooling type (0x4F05), mixer module 0x601.
  # Write header C0 01 FA <idx> 00 <v>. 0x4F08 WRITE DEVICE-CONFIRMED
  # (30.07.2026, logs/kuehlen-verify.log): TX C0 01 FA 4F 08 00 00/01 -> device
  # reported the new value ~0.8 s later, also verified on the display.
  # Cooling type 0x4F05 same module/format, on 30.07.2026 writing VERIFIED ON
  # THE DISPLAY (user, surface<->fan + back) - without a TX log capture.
  # Enum values confirmed by reading 30.07.2026 (1=on/surface, 0=off/fan).
  # =======================================================================
  - platform: template
    name: "Set Cooling Circuit 1"
    entity_category: config
    id: kuehlkreis_select
    optimistic: false
    options:
      - "Off"
      - "On"
    set_action:
      - lambda: |-
          if (id(g_mode) < 2) { ESP_LOGW("wpe_mode", "Write blocked - access mode %d, full access (2) required", id(g_mode)); return; }
          uint8_t v = (x == "On") ? 1 : 0;
          std::vector<uint8_t> w = {0xC0, 0x01, 0xFA, 0x4F, 0x08, 0x00, v};
          id(my_canbus).send_data(0x680, false, w);
          char txbuf[24];
          snprintf(txbuf, sizeof(txbuf), "%02X %02X %02X %02X %02X %02X %02X",
                   w[0], w[1], w[2], w[3], w[4], w[5], w[6]);
          ESP_LOGI("wpe_i", "TX id=0x680 raw=%s", txbuf);
          ESP_LOGI("wpe_i", "Cooling circuit 1 set to: %s (%d)", x.c_str(), v);
      - delay: 250ms
      - lambda: |-
          if (id(g_mode) < 2) return;  // write guard (read-back)
          std::vector<uint8_t> rb = {0xC1, 0x01, 0xFA, 0x4F, 0x08, 0x00, 0x00};
          id(my_canbus).send_data(0x680, false, rb);

  - platform: template
    name: "Set Cooling Type"
    entity_category: config
    id: kuehlart_select
    optimistic: false
    options:
      - "Fan coil cooling"
      - "Surface cooling"
    set_action:
      - lambda: |-
          if (id(g_mode) < 2) { ESP_LOGW("wpe_mode", "Write blocked - access mode %d, full access (2) required", id(g_mode)); return; }
          uint8_t v = (x == "Surface cooling") ? 1 : 0;
          std::vector<uint8_t> w = {0xC0, 0x01, 0xFA, 0x4F, 0x05, 0x00, v};
          id(my_canbus).send_data(0x680, false, w);
          char txbuf[24];
          snprintf(txbuf, sizeof(txbuf), "%02X %02X %02X %02X %02X %02X %02X",
                   w[0], w[1], w[2], w[3], w[4], w[5], w[6]);
          ESP_LOGI("wpe_i", "TX id=0x680 raw=%s", txbuf);
          ESP_LOGI("wpe_i", "Cooling type set to: %s (%d)", x.c_str(), v);
      - delay: 250ms
      - lambda: |-
          if (id(g_mode) < 2) return;  // write guard (read-back)
          std::vector<uint8_t> rb = {0xC1, 0x01, 0xFA, 0x4F, 0x05, 0x00, 0x00};
          id(my_canbus).send_data(0x680, false, rb);

  # =======================================================================
  # Top-level COOLING switch (index 0x4F07). Manager/system value
  # (0x4Fxx) like the operating mode (0x4F1B), hence write header 32 00
  # (module 0x180). WRITE DEVICE-CONFIRMED (30.07.2026,
  # logs/kuehlen-verify.log): TX 32 00 FA 4F 07 00 00 -> device reported
  # 0x4F07 val=0 0.56 s later, TX ..00 01 -> val=1 0.86 s later; both
  # directions also verified on the WPM display. Read-back header 31 00
  # (0x180) also device-confirmed (poll is answered).
  # =======================================================================
  - platform: template
    name: "Set Cooling"
    entity_category: config
    id: kuehlen_select
    optimistic: false
    options:
      - "Off"
      - "On"
    set_action:
      - lambda: |-
          if (id(g_mode) < 2) { ESP_LOGW("wpe_mode", "Write blocked - access mode %d, full access (2) required", id(g_mode)); return; }
          uint8_t v = (x == "On") ? 1 : 0;
          std::vector<uint8_t> w = {0x32, 0x00, 0xFA, 0x4F, 0x07, 0x00, v};
          id(my_canbus).send_data(0x680, false, w);
          char txbuf[24];
          snprintf(txbuf, sizeof(txbuf), "%02X %02X %02X %02X %02X %02X %02X",
                   w[0], w[1], w[2], w[3], w[4], w[5], w[6]);
          ESP_LOGI("wpe_i", "TX id=0x680 raw=%s", txbuf);
          ESP_LOGI("wpe_i", "Cooling set to: %s (%d)", x.c_str(), v);
      - delay: 250ms
      - lambda: |-
          if (id(g_mode) < 2) return;  // write guard (read-back)
          std::vector<uint8_t> rb = {0x31, 0x00, 0xFA, 0x4F, 0x07, 0x00, 0x00};
          id(my_canbus).send_data(0x680, false, rb);

# =========================================================================
# Heating-curve slope (index 0x4F2B, mixer module 0x601).
# WRITE DEVICE-CONFIRMED (30.07.2026): our write from 0x680 with
# C0 01 FA 4F 2B <hi> <lo>   (C0 01 = set/nibble 0 at 0x601)
# changed the value 0.50 -> 0.40; verified on the WPM4 display
# (STEIGUNG HEIZKURVE 0.40), TX log C0 01 FA 4F 2B 00 28 present.
# Write header derived via display sniff (logs/heizkurve-write-*.log).
# We send the payload over 0x680 (never 0x100).
# Device valid range per sniff (F8/F9 frames): 0.20 - 3.00.
#
# Limits deliberately conservative (0.1-2.5): per the manual
# wrong heating-curve values can damage the heat pump or the
# screed. Typical guide values: underfloor heating ~0.4,
# radiator heating ~0.8.
# =========================================================================
number:
  - platform: template
    name: "Set Heating Curve Slope"
    entity_category: config
    id: steigung_heizkurve_set
    optimistic: false
    min_value: 0.1
    max_value: 2.5
    step: 0.05
    unit_of_measurement: ""
    set_action:
      - lambda: |-
          if (id(g_mode) < 2) { ESP_LOGW("wpe_mode", "Write blocked - access mode %d, full access (2) required", id(g_mode)); return; }
          int16_t v = (int16_t) round(x * 100.0f);
          uint8_t val_hi = (v >> 8) & 0xFF;
          uint8_t val_lo = v & 0xFF;
          std::vector<uint8_t> w = {0xC0, 0x01, 0xFA, 0x4F, 0x2B, val_hi, val_lo};
          id(my_canbus).send_data(0x680, false, w);
          char txbuf[24];
          snprintf(txbuf, sizeof(txbuf), "%02X %02X %02X %02X %02X %02X %02X",
                   w[0], w[1], w[2], w[3], w[4], w[5], w[6]);
          ESP_LOGI("wpe_i", "TX id=0x680 raw=%s", txbuf);
          ESP_LOGI("wpe_i", "Heating curve slope set to: %.2f (raw=%d)", x, v);
      - delay: 250ms
      - lambda: |-
          if (id(g_mode) < 2) return;  // write guard (read-back)
          // Immediate read-back (see comfort temperature): otherwise value
          // adoption takes until the next 60s poll (observed on the device).
          std::vector<uint8_t> rb = {0xC1, 0x01, 0xFA, 0x4F, 0x2B, 0x00, 0x00};
          id(my_canbus).send_data(0x680, false, rb);

  # =======================================================================
  # Comfort / eco temperature heating circuit (index 0x4EB8 / 0x4EB9,
  # mixer module 0x601). Write format derived from the confirmed heating-
  # curve write: C0 01 FA 4E B8/B9 <hi> <lo> (value = degC * 10),
  # sent over 0x680. NOT YET verified on the device - first real
  # write test deliberately in a small step, TX log (C0 01 ..) AND display
  # check. The old 21.07 failure was due to the wrong header (32 00).
  # Limits conservative: room target temperatures, no screed risk as with
  # the heating curve, but avoid extremes. Device min/max unknown.
  # =======================================================================
  - platform: template
    name: "Set Comfort Temperature Heating Circuit"
    entity_category: config
    id: komforttemperatur_hk_set
    optimistic: false
    min_value: 10.0
    max_value: 28.0
    step: 0.1
    unit_of_measurement: "°C"
    device_class: temperature
    set_action:
      - lambda: |-
          if (id(g_mode) < 2) { ESP_LOGW("wpe_mode", "Write blocked - access mode %d, full access (2) required", id(g_mode)); return; }
          int16_t v = (int16_t) round(x * 10.0f);
          uint8_t val_hi = (v >> 8) & 0xFF;
          uint8_t val_lo = v & 0xFF;
          std::vector<uint8_t> w = {0xC0, 0x01, 0xFA, 0x4E, 0xB8, val_hi, val_lo};
          id(my_canbus).send_data(0x680, false, w);
          char txbuf[24];
          snprintf(txbuf, sizeof(txbuf), "%02X %02X %02X %02X %02X %02X %02X",
                   w[0], w[1], w[2], w[3], w[4], w[5], w[6]);
          ESP_LOGI("wpe_i", "TX id=0x680 raw=%s", txbuf);
          ESP_LOGI("wpe_i", "Comfort temperature set to: %.1f (raw=%d)", x, v);
      - delay: 250ms
      - lambda: |-
          if (id(g_mode) < 2) return;  // write guard (read-back)
          // Immediate read-back instead of waiting for the 60s poll: request
          // the value right after the write (module 0x601 answers promptly).
          std::vector<uint8_t> rb = {0xC1, 0x01, 0xFA, 0x4E, 0xB8, 0x00, 0x00};
          id(my_canbus).send_data(0x680, false, rb);

  - platform: template
    name: "Set Eco Temperature Heating Circuit"
    entity_category: config
    id: ecotemperatur_hk_set
    optimistic: false
    min_value: 5.0
    max_value: 24.0
    step: 0.1
    unit_of_measurement: "°C"
    device_class: temperature
    set_action:
      - lambda: |-
          if (id(g_mode) < 2) { ESP_LOGW("wpe_mode", "Write blocked - access mode %d, full access (2) required", id(g_mode)); return; }
          int16_t v = (int16_t) round(x * 10.0f);
          uint8_t val_hi = (v >> 8) & 0xFF;
          uint8_t val_lo = v & 0xFF;
          std::vector<uint8_t> w = {0xC0, 0x01, 0xFA, 0x4E, 0xB9, val_hi, val_lo};
          id(my_canbus).send_data(0x680, false, w);
          char txbuf[24];
          snprintf(txbuf, sizeof(txbuf), "%02X %02X %02X %02X %02X %02X %02X",
                   w[0], w[1], w[2], w[3], w[4], w[5], w[6]);
          ESP_LOGI("wpe_i", "TX id=0x680 raw=%s", txbuf);
          ESP_LOGI("wpe_i", "Eco temperature set to: %.1f (raw=%d)", x, v);
      - delay: 250ms
      - lambda: |-
          if (id(g_mode) < 2) return;  // write guard (read-back)
          // Immediate read-back (see comfort temperature).
          std::vector<uint8_t> rb = {0xC1, 0x01, 0xFA, 0x4E, 0xB9, 0x00, 0x00};
          id(my_canbus).send_data(0x680, false, rb);

  # Minimum temperature HC (0x4EA7). On the display the device only knows "Off" or
  # 10-30 degC (nothing in between; F8/F9 sniff: min 10.0 / max 30.0). The slider
  # reflects this: 0 = "Off" (special value 0x9000), from 10 = real temperature.
  # Anything below 10 is caught by the set logic as "Off", so an
  # invalid 0.1-9.9 degC is never sent.
  - platform: template
    name: "Set Minimum Temperature Heating Circuit"
    entity_category: config
    id: min_temp_hk_set
    optimistic: false
    min_value: 0
    max_value: 30.0
    step: 1
    unit_of_measurement: "°C"
    device_class: temperature
    set_action:
      - lambda: |-
          if (id(g_mode) < 2) { ESP_LOGW("wpe_mode", "Write blocked - access mode %d, full access (2) required", id(g_mode)); return; }
          uint16_t raw;
          const char* mode;
          if (x < 10.0f) {            // Slider < 10 = "Off" (0x9000)
            raw = 0x9000;
            mode = "Off";
          } else {
            raw = (uint16_t)((int16_t) round(x * 10.0f));
            mode = "Temp";
          }
          uint8_t val_hi = (raw >> 8) & 0xFF;
          uint8_t val_lo = raw & 0xFF;
          std::vector<uint8_t> w = {0xC0, 0x01, 0xFA, 0x4E, 0xA7, val_hi, val_lo};
          id(my_canbus).send_data(0x680, false, w);
          char txbuf[24];
          snprintf(txbuf, sizeof(txbuf), "%02X %02X %02X %02X %02X %02X %02X",
                   w[0], w[1], w[2], w[3], w[4], w[5], w[6]);
          ESP_LOGI("wpe_i", "TX id=0x680 raw=%s", txbuf);
          ESP_LOGI("wpe_i", "Minimum temperature set (%s) to: %.1f", mode, x);
      - delay: 250ms
      - lambda: |-
          if (id(g_mode) < 2) return;  // write guard (read-back)
          // Immediate read-back (see comfort temperature).
          std::vector<uint8_t> rb = {0xC1, 0x01, 0xFA, 0x4E, 0xA7, 0x00, 0x00};
          id(my_canbus).send_data(0x680, false, rb);

  # Room influence HC (0x4EA4): directly in percent, device range 0-100 %.
  # The device snaps to steps of 5 on the display (18% sent -> 20%
  # stored, device-verified in the log) -> step 5.
  - platform: template
    name: "Set Room Influence Heating Circuit"
    entity_category: config
    id: raumeinfluss_hk_set
    optimistic: false
    min_value: 0
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    set_action:
      - lambda: |-
          if (id(g_mode) < 2) { ESP_LOGW("wpe_mode", "Write blocked - access mode %d, full access (2) required", id(g_mode)); return; }
          int16_t v = (int16_t) round(x);
          uint8_t val_hi = (v >> 8) & 0xFF;
          uint8_t val_lo = v & 0xFF;
          std::vector<uint8_t> w = {0xC0, 0x01, 0xFA, 0x4E, 0xA4, val_hi, val_lo};
          id(my_canbus).send_data(0x680, false, w);
          char txbuf[24];
          snprintf(txbuf, sizeof(txbuf), "%02X %02X %02X %02X %02X %02X %02X",
                   w[0], w[1], w[2], w[3], w[4], w[5], w[6]);
          ESP_LOGI("wpe_i", "TX id=0x680 raw=%s", txbuf);
          ESP_LOGI("wpe_i", "Room influence set to: %.0f%% (raw=%d)", x, v);
      - delay: 250ms
      - lambda: |-
          if (id(g_mode) < 2) return;  // write guard (read-back)
          // Immediate read-back (see comfort temperature).
          std::vector<uint8_t> rb = {0xC1, 0x01, 0xFA, 0x4E, 0xA4, 0x00, 0x00};
          id(my_canbus).send_data(0x680, false, rb);

  # =======================================================================
  # Cooling numeric values (mixer module 0x601): room target temperature (0x4F04),
  # cooling-curve slope (0x4FB9), start temperature (0x4FBE).
  # Write format derived from the confirmed heating-curve write
  # (C0 01 FA <idx> <hi> <lo>, over 0x680).
  # Room target temperature 0x4F04 WRITE DEVICE-CONFIRMED (30.07.2026,
  # logs\raumsoll-write.log): TX C0 01 FA 4F 04 00 C9 (20.1) -> device reported
  # val=201 ~0.8 s later (broadcast 80 01 + answer D2 00), 20.1 on the display,
  # then cleanly back to 20.0.
  # 0x4FB9/0x4FBE writing VERIFIED ON THE DISPLAY on 30.07.2026 (user, each
  # set + reset) - without a TX log capture; write path = these
  # entities (C0 01, like log-proven 0x4F04). Cooling-curve slope, due to dew-point/
  # screed risk, still only change in small steps.
  # Limits = device ranges read off the display (30.07.2026).
  # Caution cooling curve: too steep -> low flow temp -> dew-point/
  # condensation risk at the screed; when in doubt keep it flat.
  # =======================================================================
  - platform: template
    name: "Set Room Setpoint Temperature Cooling"
    entity_category: config
    id: raumsolltemp_kuehlen_set
    optimistic: false
    min_value: 20.0
    max_value: 30.0
