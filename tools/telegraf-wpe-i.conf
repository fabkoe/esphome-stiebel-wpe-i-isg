# Telegraf config: bridge the WPE-I CAN firehose (MQTT) into InfluxDB v2.
#
# The ESP publishes InfluxDB line protocol on topic wpe-i/can (see
# esphome/wpe-i-sniffer.yaml), so Telegraf only has to forward it with
# data_format = "influx" - no field/tag mapping needed.
#
# Run standalone:   telegraf --config telegraf-wpe-i.conf
# Or drop the [[inputs]]/[[outputs]] blocks into the Telegraf HA add-on.
# Replace every YOUR_* placeholder before use.

[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://YOUR_BROKER_HOST:1883"]
  topics  = ["wpe-i/can"]
  username = "YOUR_MQTT_USER"
  password = "YOUR_MQTT_PASSWORD"
  # The payload is already InfluxDB line protocol.
  data_format = "influx"

[[outputs.influxdb_v2]]
  urls         = ["http://YOUR_INFLUX_HOST:8086"]
  token        = "YOUR_INFLUX_TOKEN"
  organization = "YOUR_ORG"
  bucket       = "wpe_i"
