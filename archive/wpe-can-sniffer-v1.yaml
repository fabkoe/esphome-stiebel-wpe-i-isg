esphome:
  name: wpe-can-sniffer
  friendly_name: WPE CAN Sniffer

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

# --- Netzwerk ---
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  level: DEBUG

api:

ota:
  platform: esphome

# Für Zeitstempel in den geloggten Frames
time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin

# --- MQTT: hier landen die geloggten Frames als CSV-Zeilen ---
mqtt:
  id: mqtt_client
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: false
  topic_prefix: wpe_can_sniffer

# --- Zähler, damit du siehst, ob überhaupt Traffic ankommt ---
globals:
  - id: frame_count
    type: uint32_t
    restore_value: false
    initial_value: '0'

sensor:
  - platform: template
    name: "CAN Frame Count"
    id: can_frame_count
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      return id(frame_count);

# --- CAN Interface (Waveshare ESP32-S3-RS485-CAN: CAN TX=GPIO15, RX=GPIO16) ---
canbus:
  - platform: esp32_can
    id: my_canbus
    tx_pin: GPIO15
    rx_pin: GPIO16
    can_id: 0
    bit_rate: 20kbps   # Stiebel/Elster-Protokoll läuft typischerweise mit 20 kBaud
    on_frame:
      - can_id: 0
        can_id_mask: 0
        use_extended_id: false
        then:
          - lambda: |-
              id(frame_count) += 1;

              // x ist hier direkt der Daten-Vektor (std::vector<uint8_t>),
              // can_id kommt als eigene Variable vom canbus-Trigger
              char hexdata[64] = {0};
              char byte_str[4];
              for (size_t i = 0; i < x.size(); i++) {
                sprintf(byte_str, "%02X ", x[i]);
                strcat(hexdata, byte_str);
              }

              // Zeile im Format: unix_timestamp;can_id_hex;len;data_hex
              auto now = id(sntp_time).now();
              char line[128];
              snprintf(line, sizeof(line), "%lld;0x%03X;%d;%s",
                        (long long) now.timestamp, can_id, (int) x.size(), hexdata);

              // Zusätzlich ins normale Log (praktisch fürs Live-Mitlesen über ESPHome-Konsole)
              ESP_LOGI("can_sniff", "%s", line);

              // Und per MQTT raus, damit du es sauber in eine Datei umleiten kannst
              id(mqtt_client)->publish("wpe/canlog", line);

# --- Optional: kleiner Button um den Zähler zurückzusetzen (z.B. vor einem neuen Testlauf) ---
button:
  - platform: template
    name: "Reset Frame Counter"
    on_press:
      - lambda: |-
          id(frame_count) = 0;
