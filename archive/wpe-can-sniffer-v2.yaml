substitutions:
  # Einfach hier ändern und neu flashen, um verschiedene Baudraten durchzutesten:
  # 20kbps -> 50kbps -> 100kbps -> 125kbps
  can_bitrate: "20kbps"

esphome:
  name: wpe-can-sniffer
  friendly_name: WPE CAN Sniffer

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

# --- Netzwerk ---
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  level: DEBUG

api:

ota:
  platform: esphome

# Für Zeitstempel in den geloggten Frames
time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin

# MQTT ist bewusst NICHT mehr enthalten:
# Das Board hängt im VLAN 30 (IoT), der Broker in VLAN 60 (Server) -
# die Firewall blockt das (select() timeout im Log). Wir lesen die
# Frames stattdessen direkt über die ESPHome-API/Logger mit:
#
#   esphome logs wpe-can-sniffer-v2.yaml > canlog_$(date +%Y%m%d_%H%M).txt
#
# Das läuft über dieselbe Verbindung, über die du schon jetzt die
# Logs siehst - kein zusätzliches Firewall-Routing nötig.

# --- Zähler, damit du auf einen Blick siehst, ob überhaupt Traffic ankommt ---
globals:
  - id: frame_count
    type: uint32_t
    restore_value: false
    initial_value: '0'

sensor:
  - platform: template
    name: "CAN Frame Count"
    id: can_frame_count
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      return id(frame_count);

# --- CAN Interface (Waveshare ESP32-S3-RS485-CAN: CAN TX=GPIO15, RX=GPIO16) ---
canbus:
  - platform: esp32_can
    id: my_canbus
    tx_pin: GPIO15
    rx_pin: GPIO16
    can_id: 0
    bit_rate: ${can_bitrate}
    on_frame:
      - can_id: 0
        can_id_mask: 0
        use_extended_id: false
        then:
          - lambda: |-
              id(frame_count) += 1;

              // x ist hier direkt der Daten-Vektor (std::vector<uint8_t>),
              // can_id kommt als eigene Variable vom canbus-Trigger
              char hexdata[64] = {0};
              char byte_str[4];
              for (size_t i = 0; i < x.size(); i++) {
                sprintf(byte_str, "%02X ", x[i]);
                strcat(hexdata, byte_str);
              }

              // Zeile im Format: unix_timestamp;can_id_hex;len;data_hex
              // Diese Zeile landet im normalen ESPHome-Log und damit
              // automatisch in der Datei, wenn du "esphome logs" umleitest.
              auto now = id(sntp_time).now();
              char line[128];
              snprintf(line, sizeof(line), "%lld;0x%03X;%d;%s",
                        (long long) now.timestamp, can_id, (int) x.size(), hexdata);

              ESP_LOGI("can_sniff", "%s", line);

# --- Kleiner Button, um den Zähler vor einem neuen Testlauf zurückzusetzen ---
button:
  - platform: template
    name: "Reset Frame Counter"
    on_press:
      - lambda: |-
          id(frame_count) = 0;
